name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: "Chrome 130 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: sites
    attributes:
      label: Source and destination
      description: Host types only (for example "Vercel preview → localhost"). Never paste cookie or storage values.
  - type: textarea
    id: logs
    attributes:
      label: Error messages
      description: Text from the popup or the service-worker console. Remove any secrets.
      render: text
